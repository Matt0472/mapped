<div class="term skills-term">
	<div class="term-bar">
		<span class="term-dot" style="background:#ff5f56"></span>
		<span class="term-dot" style="background:#ffbd2e"></span>
		<span class="term-dot" style="background:#27c93f"></span>
		<span class="term-title">mattiapedone@mapped:~$ cat <b>skills.txt</b></span>
	</div>
	<div class="term-body">
		<div class="uni-body">
			{%- for group in site.data.skills %}
			<div class="uni-group">
				<p class="uni-group-title"># {{ group.title | downcase }}</p>
				{%- for skill in group.skills %}
				<div class="term-line">
					<span class="term-prompt">&gt;</span>
					<span class="term-name">{{ skill.name }}</span>
					<img class="term-icon" src="{{ skill.icon | relative_url }}" alt="" width="18" height="18" loading="lazy" decoding="async">
					{%- if skill.description %}<span class="term-comment"># {{ skill.description }}</span>{%- endif %}
				</div>
				{%- endfor %}
			</div>
			{%- endfor %}
		</div>
		<div class="term-line term-cursor"><span class="term-prompt">&gt;</span><span class="cursor"></span></div>
	</div>
</div>
