<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <!-- Warm, filmic backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2230"/>
      <stop offset="45%" stop-color="#5b3140"/>
      <stop offset="100%" stop-color="#7c3f3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#e6b7a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e6b7a3" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft out-of-focus bokeh dot -->
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9d6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffcfae" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffcfae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6c9c0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f6c9c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Bokeh field: soft, blurred highlights like out-of-focus lights -->
  <g filter="url(#blur)">
    <circle cx="960" cy="150" r="130" fill="url(#dot)"/>
    <circle cx="1080" cy="360" r="80"  fill="url(#dot2)"/>
    <circle cx="820"  cy="300" r="55"  fill="url(#dot)"/>
    <circle cx="1050" cy="620" r="110" fill="url(#dot2)"/>
    <circle cx="700"  cy="620" r="45"  fill="url(#dot)"/>
    <circle cx="150"  cy="680" r="150" fill="url(#dot2)"/>
    <circle cx="90"   cy="200" r="70"  fill="url(#dot)"/>
    <circle cx="320"  cy="120" r="40"  fill="url(#dot2)"/>
    <circle cx="480"  cy="700" r="30"  fill="url(#dot)"/>
    <circle cx="600"  cy="90"  r="25"  fill="url(#dot2)"/>
  </g>

  <!-- Camera aperture / iris motif, subtle in the lower-left -->
  <g transform="translate(210 560)" opacity="0.16" stroke="#ffe9d6" stroke-width="6" fill="none" stroke-linejoin="round">
    <circle r="120"/>
    <g>
      <path d="M0 -120 L104 -60 L0 0 Z"/>
      <path d="M104 -60 L104 60 L0 0 Z"/>
      <path d="M104 60 L0 120 L0 0 Z"/>
      <path d="M0 120 L-104 60 L0 0 Z"/>
      <path d="M-104 60 L-104 -60 L0 0 Z"/>
      <path d="M-104 -60 L0 -120 L0 0 Z"/>
    </g>
  </g>
</svg>
